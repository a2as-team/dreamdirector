variables:
  GOOGLE_API_KEY:
    type: env
    params:
      caller: [os.getenv, genai.Client]
      path: [agents.agent]
  PORT:
    type: env
    params:
      caller: [os.environ.get]
      path: [backend.app]

files:
  ../:
    type: literal
    actions: [read]
    params:
      caller: [get_media_files, get_media_file]
  ../agents:
    type: literal
    actions: [read]
    params:
      caller: [get_media_files, get_media_file]
  ./:
    type: pattern
    actions: [read]
    params:
      patterns: [generated_scene_*.png, generated_video_*.mp4, lyria_final_*.wav]
      caller: [get_media_files]
  chunk_file:
    type: variable
    actions: [read, delete]
    params:
      caller: [wave.open, os.path.basename, os.remove]
  index.html:
    type: literal
    actions: [read]
    params:
      caller: [serve_index, serve_frontend_files]
      path: [static_dir]
  media_dir:
    type: literal
    actions: [read]
    params:
      caller: [Path('../agents')]
  scan_dir:
    type: variable
    actions: [read]
    params:
      caller: [scan_dir.glob]
  seed_image_path:
    type: variable
    actions: [read]
    params:
      caller: [os.path.exists, open]
  static_dir:
    type: literal
    actions: [read]
    params:
      caller: [Path(static)]
  test_lyria_audio.wav:
    type: literal
    actions: [write]
    params:
      caller: [open]
      alias: [f]
      variable: test_filename
